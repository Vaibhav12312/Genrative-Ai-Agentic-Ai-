services:
  epfosathi:
    build: .
    container_name: epfosathi
    ports:
      - "8000:8000"
    environment:
      EPFOSATHI_DB: /app/data/epfosathi.db
    volumes:
      - epfosathi_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  epfosathi_data:
